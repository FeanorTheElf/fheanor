[package]
name = "fheanor"
version = "0.12.1"
edition = "2024"

repository = "https://github.com/FeanorTheElf/fheanor"
keywords = ["cryptography", "encryption", "fhe", "homomorphic"]
readme = "Readme.md"
description = "A library that provides fast implementations of rings commonly used in homomorphic encryption, built on feanor-math."
license = "MIT"

[lib]
crate-type = ["rlib"]
bench = true

[dependencies]
feanor-math = { version = "3.6.2", features = ["generic_tests", "unstable-enable"] }
oorandom = "11.1.3"
serde = { version = "1.0.207", features = ["derive"] }
thread_local = "1.1.8"
rand = "0.10.4"
rand_distr = "0.6.0"
take_mut = "0.2.2"
tracing = "0.1.41"
serde_json = "1.0.125"
postcard = { version = "1.1.3", features = ["use-std"] }
feanor-serde = "0.1.5"
fhe-ir = "0.2.0"
append-only-vec = "0.1.8"
rayon-cond = "0.4.0"
rayon = "1.12.0"
feanor-mempool = "3.0.0"

[dev-dependencies]
serde_assert = "0.8.0"
tracing-subscriber = "0.3.20"
tracing-chrome = "0.7.2"
serde_path_to_error = "0.1.17"
feanor-tracing = "1.0.5"

[features]
parallel = []
generic_tests = []

[profile.profiling]
inherits = "bench"
debug = true
lto = "fat"
panic = "abort"

[profile.release]
lto = "fat"
panic = "abort"

# to allow running two different tests at the same time (i.e. cargo uses different directory for output executable)
[profile.test2]
inherits = "test"
